name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# macOS is not in CI: brew's GDAL is newer than 3.9 and gdal-sys 0.10 has no prebuilt
# bindings for it. Re-add with a gdal crate upgrade or gdal-sys's bindgen feature.
jobs:
  linux:
    # ubuntu-24.04 ships GDAL 3.8.4 / PROJ 9.4, supported by gdal-sys 0.10 / proj-sys 0.23.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libproj-dev pkg-config libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    # Unverified: GDAL/PROJ come from the pixi env (conda-forge), found via pkg-config.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.0
          locked: true
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run check
