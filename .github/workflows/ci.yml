name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Version risk (unverified): the project was developed against GDAL 3.9 / PROJ 9.6.
      # ubuntu-24.04 ships GDAL 3.8.4 / PROJ 9.4 (proj-sys needs >= 9.2). Homebrew ships the
      # newest GDAL, which may be newer than gdal-sys 0.10's prebuilt bindings; if so, pin
      # a formula (gdal@3.9 style) or enable gdal-sys's bindgen feature.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libproj-dev pkg-config libclang-dev

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal proj pkg-config

      # vcpkg is preinstalled on the runner at C:\vcpkg. Building gdal from source is slow, so
      # the binary cache is persisted. proj-sys finds PROJ through pkg-config; LLVM (for bindgen)
      # is preinstalled on the runner.
      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-gdal-proj-v1

      - name: System libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install gdal:x64-windows proj:x64-windows pkgconf:x64-windows
          $root = "C:\vcpkg\installed\x64-windows"
          "GDAL_HOME=$root" >> $env:GITHUB_ENV
          "GDAL_DATA=$root\share\gdal" >> $env:GITHUB_ENV
          "PROJ_DATA=$root\share\proj" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "PKG_CONFIG=$root\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
