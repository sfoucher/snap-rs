[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
ndarray = "0.16"
thiserror = "2"
rayon = "1"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
chumsky = "0.9"
gdal = "0.17"
proj = "0.27"
eframe = "0.29"
egui = "0.29"
egui_dock = "0.14"
wgpu = "22"
rfd = "0.15"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
