[workspace]
name = "snap-rs"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# gdal 0.17 / gdal-sys 0.10 ship prebuilt bindings (verified against 3.9); cap
# below the first release we have not tried. Raise when gdal-sys is bumped.
gdal = ">=3.8,<3.10"
libgdal = ">=3.8,<3.10"
proj = ">=9.4"
rust = ">=1.80"
pkg-config = "*"
# proj-sys runs bindgen at build time
clang = "*"
libclang = "*"
c-compiler = "*"
cxx-compiler = "*"

[tasks]
test = "cargo test --workspace"
run = "cargo run -p snap-gui"
check = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

[activation.env]
GDAL_DATA = "$CONDA_PREFIX/share/gdal"
PROJ_DATA = "$CONDA_PREFIX/share/proj"

[target.linux-64.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

# Windows values are unverified (no Windows machine). GDAL_HOME is deliberately unset:
# gdal-sys only accepts lib\gdal_i.lib there and conda ships lib\gdal.lib, so it
# falls through to pkg-config via PKG_CONFIG_PATH (gdal-sys 0.10 build.rs does this when
# GDAL_HOME/GDAL_LIB_DIR are unset). Library\bin is put on PATH by pixi activation.
[target.win-64.activation.env]
GDAL_DATA = "%CONDA_PREFIX%\\Library\\share\\gdal"
PROJ_DATA = "%CONDA_PREFIX%\\Library\\share\\proj"
PKG_CONFIG_PATH = "%CONDA_PREFIX%\\Library\\lib\\pkgconfig"

[target.osx-64.activation.env]
DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[target.osx-arm64.activation.env]
DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib"
