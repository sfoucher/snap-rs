[workspace]
name = "snap-rs"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# gdal 0.17 / gdal-sys 0.10 ship prebuilt bindings (verified against 3.9); cap
# below the first release we have not tried. Raise when gdal-sys is bumped.
gdal = ">=3.8,<3.10"
libgdal = ">=3.8,<3.10"
proj = ">=9.4"
rust = ">=1.82" # Option::is_none_or
pkg-config = "*"
# proj-sys runs bindgen at build time
clang = "*"
libclang = "*"
c-compiler = "*"
cxx-compiler = "*"

[tasks]
test = "cargo test --workspace"
run = "cargo run -p snap-gui"
check = "cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace"

[activation.env]
GDAL_DATA = "$CONDA_PREFIX/share/gdal"
PROJ_DATA = "$CONDA_PREFIX/share/proj"

[target.linux-64.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[target.win-64.activation.env]
# GDAL_HOME is deliberately unset: gdal-sys only accepts lib\gdal_i.lib there and conda ships
# lib\gdal.lib. GDAL_LIB_DIR makes gdal-sys link gdal.lib only; without it pkg-config emits
# gdal.pc's private libs (curl.lib, ssh2.lib) and the link fails with LNK1181. Library\bin is
# put on PATH by pixi activation. ci/pkgconfig-win shadows conda's broken libcurl.pc (-lcurl vs libcurl.lib).
GDAL_DATA = "%CONDA_PREFIX%\\Library\\share\\gdal"
PROJ_DATA = "%CONDA_PREFIX%\\Library\\share\\proj"
GDAL_LIB_DIR = "%CONDA_PREFIX%\\Library\\lib"
GDAL_INCLUDE_DIR = "%CONDA_PREFIX%\\Library\\include"
# bindgen (proj-sys) looks for libclang.dll here; conda puts it in Library\bin, not on its search path.
LIBCLANG_PATH = "%CONDA_PREFIX%\\Library\\bin"
PKG_CONFIG_PATH = "%PIXI_PROJECT_ROOT%\\ci\\pkgconfig-win;%CONDA_PREFIX%\\Library\\lib\\pkgconfig"

[target.osx-64.activation.env]
DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[target.osx-arm64.activation.env]
DYLD_FALLBACK_LIBRARY_PATH = "$CONDA_PREFIX/lib"
